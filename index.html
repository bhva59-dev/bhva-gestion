<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}img{max-width:100%}[hidden]{display:none!important}body{margin:0}</style>
<title>BHVA Comptoir</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BHVA">
<meta name="application-name" content="BHVA">
<meta name="theme-color" content="#163bdc">
<link rel="apple-touch-icon" id="touch-icon" href="icons/bhva-180.png">
<link rel="icon" type="image/png" href="icons/bhva-180.png">
<link rel="manifest" id="manifest-link" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;700&family=Barlow+Semi+Condensed:wght@700&display=swap">
<style>
/* Layout concept: a shop-counter app. A fixed red masthead with the module strip, a wide working area,
   and a print queue that sits beside the catalogue on desktop and below it on a phone. */
:root{
  --bg:#f1f2ef;          /* tile-wall off-white */
  --surface:#ffffff;
  --surface-2:#e7e9e4;
  --surface-3:#dcdfd8;
  --fg:#1b1917;
  --fg-2:#5f5b55;
  --fg-3:#8b867e;
  --line:#d3d6cf;
  --line-strong:#b9bdb4;
  --accent:#163bdc;      /* BHVA blue */
  --accent-2:#1130b0;
  --accent-fg:#ffffff;
  --accent-soft:#e2e8fb;
  --ok:#1f7a3f; --ok-soft:#dff3e5;
  --warn:#b8650b; --warn-soft:#fbecd3;
  --crit:#c21f2b; --crit-soft:#fbe0e2;
  --info:#1d5fa8; --info-soft:#dfeafb; --today:#163bdc;
  --shadow:0 1px 2px rgba(20,18,16,.08),0 6px 20px rgba(20,18,16,.08);
  --font-display:'Anton','Impact','Arial Narrow',sans-serif;
  --font-ui:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius:10px; --radius-s:6px;
  --nav-h:56px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141312; --surface:#1f1d1b; --surface-2:#2a2825; --surface-3:#36332f;
    --fg:#f1ece5; --fg-2:#aaa49b; --fg-3:#7d776f; --line:#38352f; --line-strong:#4a463f;
    --accent:#5a7cf2; --accent-2:#7c98f6; --accent-fg:#ffffff; --accent-soft:#1b2550;
    --ok:#4cc27a; --ok-soft:#173424; --warn:#f0a53a; --warn-soft:#3c2a10; --crit:#ff5a66; --crit-soft:#3f1a1e;
    --info:#6ea6ea; --info-soft:#17283f; --today:#7c98f6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1f1d1b; --surface-2:#2a2825; --surface-3:#36332f;
  --fg:#f1ece5; --fg-2:#aaa49b; --fg-3:#7d776f; --line:#38352f; --line-strong:#4a463f;
  --accent:#5a7cf2; --accent-2:#7c98f6; --accent-fg:#ffffff; --accent-soft:#1b2550;
  --ok:#4cc27a; --ok-soft:#173424; --warn:#f0a53a; --warn-soft:#3c2a10; --crit:#ff5a66; --crit-soft:#3f1a1e;
  --info:#6ea6ea; --info-soft:#17283f; --today:#7c98f6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--accent)}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2)}
.muted{color:var(--fg-2)}
.small{font-size:.85rem}
.hidden,[hidden]{display:none!important}

/* ---------- masthead ---------- */
.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--accent);color:var(--accent-fg);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.masthead-inner{display:flex;align-items:center;gap:14px;height:var(--nav-h);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand-mark{width:34px;height:34px;flex:none;background:#fff;color:var(--accent);border-radius:8px;display:grid;place-items:center;font-family:var(--font-display);font-size:1.3rem;letter-spacing:.02em}
.brand-name{font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.72rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
@media(max-width:640px){.brand-sub{display:none}.brand-name{font-size:1rem}}
.mobile-bar{display:none}
@media(max-width:899px){.queue-panel{display:none}.mobile-bar{display:flex;flex-wrap:wrap;position:fixed;left:0;right:0;bottom:0;z-index:35;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.2)}.mobile-bar .btn{background:var(--accent);border-color:var(--accent);color:#fff}.page.has-bar{padding-bottom:90px}.toast-wrap{bottom:max(72px,calc(env(safe-area-inset-bottom,0px) + 72px))}}
.mode-pill{margin-left:auto;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap}
.mode-pill.local{background:rgba(0,0,0,.25)}.mode-pill.nosync{background:#d7263d;color:#fff;border-color:#d7263d;cursor:pointer;animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.55}}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;flex:none}
.bell svg{width:18px;height:18px}
.bell .bell-n{position:absolute;top:-4px;right:-4px;background:#ffd60a;color:#111;font-size:.7rem;font-weight:800;border-radius:999px;padding:1px 6px;min-width:18px}
.bell.has{background:#fff;color:var(--accent)}
body.gestion-mode .masthead{background:#1b1917;position:static}
body.gestion-mode .gest-head{position:static;box-shadow:none}
body.gestion-mode .page{padding-left:12px;padding-right:12px}
.fab-top{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:48px;height:48px;border-radius:50%;background:#111;color:#fff;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}.fab-top svg{width:20px;height:20px;transform:rotate(90deg)}
body:not(.gestion-mode) .fab-top{display:none}
body.gestion-mode .nav,body.gestion-mode .bell,body.gestion-mode .brand-sub,body.gestion-mode .mobile-bar{display:none}
body.gestion-mode .masthead-inner{height:50px}
body.gestion-mode .brand-mark{color:#1b1917}
.notif-banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-s);background:#ffd60a;color:#111;font-weight:600;margin-bottom:12px}
.notif-banner>svg{width:22px;height:22px;flex:none}.notif-banner .btn{background:#111;color:#fff;border-color:#111;white-space:nowrap}.notif-banner .fill{line-height:1.3}
.prod .newp{position:absolute;top:8px;left:8px;background:#ffd60a;color:#111;font-weight:800;font-size:.66rem;padding:2px 7px;border-radius:999px}
.gest-row{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.gest-row .n{font-weight:600;line-height:1.2}
.gest-row .s{font-size:.78rem;color:var(--fg-2)}
.gest-row input{width:110px;text-align:right;min-height:44px;font-size:1.05rem;font-weight:700}
.gest-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 6px}
.gest-top h1{margin:0;font-size:1.5rem;line-height:1.1}
.gest-head{position:sticky;top:calc(var(--nav-h) + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);padding:8px 0 10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 10px -10px rgba(0,0,0,.35)}
body.gestion-mode .gest-head{top:calc(50px + env(safe-area-inset-top,0px))}
.gest-head .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.gest-head .chips::-webkit-scrollbar{display:none}
.gest-head .chip{flex:none}
.alarm{position:fixed;inset:0;z-index:500;background:#ffd60a;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 20px;text-align:center;animation:alarmflash 1s steps(2,end) infinite}
@keyframes alarmflash{50%{background:#ffb703}}
.alarm-ico svg{width:96px;height:96px;animation:ring .5s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.alarm-title{font-family:var(--font-display,inherit);font-size:clamp(2rem,7vw,4rem);font-weight:800;letter-spacing:.04em}
.alarm-txt{font-size:clamp(1.6rem,5vw,3rem);font-weight:700;line-height:1.2}
.alarm-price{font-variant-numeric:tabular-nums}
.alarm-sub{font-size:1rem;opacity:.75}
.alarm button.alarm-ok{margin-top:10px;background:#111!important;color:#fff!important;border-color:#111!important;font-size:1.3rem;padding:18px 28px;min-height:64px;border-radius:14px;width:min(92vw,520px)}
.sound-hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:#111;color:#fff;padding:12px 16px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw}
.sound-hint svg{width:18px;height:18px;flex:none}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 max(12px,env(safe-area-inset-left,0px)) 6px max(12px,env(safe-area-inset-right,0px));margin-top:-2px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;color:rgba(255,255,255,.85);text-decoration:none;font-weight:600;font-size:.86rem;white-space:nowrap}
.nav a svg{width:16px;height:16px;flex:none}
.nav a.active{background:#fff;color:var(--accent)}
.nav a:hover:not(.active){background:rgba(255,255,255,.14)}
.nav .badge{background:#fff;color:var(--accent);border-radius:999px;padding:0 6px;font-size:.72rem;min-width:18px;text-align:center}
.nav a.active .badge{background:var(--accent);color:#fff}

/* ---------- page ---------- */
.page{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:16px}
.page-head .lead{color:var(--fg-2);max-width:60ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid-2{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.grid-2{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.card-pad{padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center}
.fill{flex:1;min-width:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:var(--radius-s);border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:600;font-size:.9rem;line-height:1.1;min-height:38px;text-decoration:none}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn-dark:hover{background:var(--fg-2)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{color:var(--crit);border-color:var(--crit)}
.btn-danger:hover{background:var(--crit-soft)}
.btn-sm{padding:5px 9px;min-height:30px;font-size:.82rem}
.btn-lg{padding:12px 18px;min-height:46px;font-size:1rem}
.btn-block{width:100%}
.icon-btn{width:34px;height:34px;padding:0;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{background:var(--surface-2)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--fg-2);letter-spacing:.02em}
.input,select.input,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--radius-s);background:var(--surface);color:var(--fg);min-height:40px}
textarea.input{min-height:90px;resize:vertical}
.input:focus{border-color:var(--info);outline:none;box-shadow:0 0 0 3px var(--info-soft)}
.input-lg{font-size:1.1rem;min-height:46px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.form-grid .span2{grid-column:span 2}
@media(max-width:480px){.form-grid .span2{grid-column:span 1}}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:18px;height:18px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--fg-3);pointer-events:none}
.search .input{padding-left:34px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--radius-s);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:5px;font-weight:600;font-size:.85rem;color:var(--fg-2)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button small{display:block;font-weight:500;font-size:.68rem;color:var(--fg-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:.84rem;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .count{opacity:.7;font-weight:500}

/* ---------- status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-crit{background:var(--crit-soft);color:var(--crit)}
.pill-info{background:var(--info-soft);color:var(--info)}
.pill-neutral{background:var(--surface-2);color:var(--fg-2)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

/* ---------- tables & lists ---------- */
.table-wrap{overflow-x:auto;max-width:100%}
table.table{width:100%;border-collapse:collapse;font-size:.9rem}
.table th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table td.right,.table th.right{text-align:right}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .main{flex:1;min-width:0}
.list-item .title{font-weight:600}
.list-item .sub{font-size:.84rem;color:var(--fg-2)}
.empty{padding:28px 16px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--fg)}

/* ---------- home ---------- */
.home-hero{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding:4px 0 18px}
.home-hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,5vw,3rem);letter-spacing:.01em;text-transform:uppercase}
.today-line{color:var(--fg-2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--font-display);font-size:1.9rem;line-height:1}
.stat .k{font-size:.78rem;color:var(--fg-2)}
.stat.alert .v{color:var(--crit)}
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.module{display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:inherit;min-height:112px;transition:border-color .15s}
.module:hover{border-color:var(--accent)}
.module .ico{width:40px;height:40px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.module .ico svg{width:20px;height:20px}
.module h3{margin-bottom:3px}
.module p{font-size:.84rem;color:var(--fg-2)}
.module .tag{margin-top:8px;font-size:.72rem;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase}
.module .alert-tag{color:var(--crit);font-weight:700}

/* ---------- prices ---------- */
.prices-controls{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.format-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.format-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-s);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700}
.format-btn small{font-weight:500;font-size:.68rem;color:var(--fg-3)}
.format-btn .mini{width:26px;height:19px;border:1.5px solid currentColor;border-radius:2px;display:grid;gap:1px;padding:1px}
.format-btn .mini i{background:currentColor;opacity:.35;border-radius:1px}
.format-btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.format-btn.on small{color:var(--bg);opacity:.75}
.bg-pick{display:flex;gap:8px;flex-wrap:wrap}
.bg-opt{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-weight:600;font-size:.84rem}
.bg-opt .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}
.bg-opt.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg) inset}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.prod{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 10px;display:flex;flex-direction:column;gap:5px;min-height:112px;transition:border-color .12s,transform .08s}
.prod:hover{border-color:var(--line-strong)}
.prod:active{transform:scale(.985)}
.prod.inq{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.prod .sp{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.prod .nm{font-weight:600;line-height:1.2;padding-right:30px}
.prod .pr{font-family:var(--font-display);font-size:1.5rem;line-height:1;margin-top:auto}
.prod .pr small{font-family:var(--font-ui);font-size:.78rem;font-weight:600;color:var(--fg-2);margin-left:2px}
.prod .or{font-size:.76rem;color:var(--fg-2)}
.prod .or.miss{color:var(--warn)}
.prod .promo{font-size:.74rem;color:var(--info);font-weight:600}
.prod .qty{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-weight:700;font-size:.74rem;padding:2px 8px;border-radius:999px}
.prod .edit{position:absolute;bottom:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg-2)}
.prod .edit svg{width:13px;height:13px}
.prod .edit:hover{color:var(--accent);border-color:var(--accent)}
.queue-panel{position:sticky;top:calc(var(--nav-h) + 48px + env(safe-area-inset-top,0px))}
.mobile-bar .btn{padding:8px 10px}
.evo-chart{background:#fff;border:1px solid var(--line);border-radius:var(--radius-s)}
.queue-list{max-height:40vh;overflow:auto}
.queue-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.88rem}
.queue-item .fmt{font-weight:700;font-size:.72rem;background:var(--surface-2);padding:2px 7px;border-radius:4px}
.queue-item .sw{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.2);flex:none}
.qty-ctl{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.qty-ctl button{border:0;background:var(--surface);width:28px;height:28px;font-weight:700}
.qty-ctl span{min-width:26px;text-align:center;font-weight:700;font-size:.85rem}
.sheet-thumbs{display:flex;gap:10px;flex-wrap:wrap;padding:12px}
.thumb{background:#fff;border:1px solid var(--line-strong);box-shadow:0 2px 8px rgba(0,0,0,.12);overflow:hidden;position:relative}
.thumb .sheet{position:absolute;left:0;top:0;transform-origin:0 0}

/* ---------- sheets & labels (real mm sizes) ---------- */
.sheet{background:#fff;color:#000;position:relative;overflow:hidden;display:grid;font-family:var(--font-ui)}
.sheet .cell{position:relative;overflow:hidden;border:0}
.sheet.guides .cell{outline:.3mm dotted #000;outline-offset:-.15mm}
/* Affiche modèle BHVA — gabarit fixe : --u = 1 % de la hauteur de l'étiquette, positions horizontales en % de la largeur.
   Rien ne bouge d'une affiche à l'autre : seules les données changent. */
.label{position:absolute;inset:0;background:#000;color:#fff;overflow:hidden;font-family:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;font-weight:700;line-height:1;font-size:calc(4*var(--u))}
.label>*{position:absolute;white-space:nowrap;line-height:1}
.label .ln{top:calc(4.2*var(--u));left:3%;right:3%;text-align:center;font-family:'Barlow Semi Condensed','Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:calc(7.8*var(--u));text-transform:uppercase;letter-spacing:.005em;overflow:hidden}
.label .ln.long{font-size:calc(6.4*var(--u));top:calc(4.5*var(--u))}
.label .ln.xlong{font-size:calc(5.2*var(--u));top:calc(4.75*var(--u))}
.label .apd{top:calc(20.6*var(--u));left:6%;font-size:calc(4.6*var(--u));font-weight:500}
.label .row{left:0;right:0;height:calc(var(--s)*.72*var(--u))}
.label .row>*{position:absolute;bottom:0;display:flex;align-items:flex-start}
.label .d{font-size:calc(var(--s)*var(--u));line-height:.72;display:block;letter-spacing:-.01em}
.label .q{left:7.4%}
.label .q .u{font-size:calc(var(--s)*.095*var(--u));margin-left:calc(var(--s)*.045*var(--u));margin-top:calc(var(--s)*.1*var(--u));font-weight:700}
.label .arr{left:34.3%;bottom:calc(var(--s)*.31*var(--u))!important;width:calc(var(--s)*.156*var(--u));height:calc(var(--s)*.1*var(--u))}
.label .arr svg{width:100%;height:100%;display:block}
.label .p{left:54%}
.label .p.center{left:50%;transform:translateX(-50%)}
.label .col{position:relative;height:calc(var(--s)*.72*var(--u));width:calc(var(--s)*.26*var(--u));margin-left:calc(var(--s)*.045*var(--u))}
.label .col>span{position:absolute;left:0;line-height:1}
.label .col .c{top:calc(var(--s)*-.02*var(--u));font-size:calc(var(--s)*.19*var(--u))}
.label .col .e{top:calc(var(--s)*.21*var(--u));font-size:calc(var(--s)*.17*var(--u))}
.label .col .k{top:calc(var(--s)*.41*var(--u));font-size:calc(var(--s)*.095*var(--u))}
.label .col.nocents .e{top:calc(var(--s)*.1*var(--u))}
.label .col.nocents .k{top:calc(var(--s)*.33*var(--u))}
.label .pk{left:5.3%;bottom:calc(7*var(--u));font-size:calc(4.3*var(--u));font-weight:500}
.label .or{left:71.5%;bottom:calc(7*var(--u));font-size:calc(4.3*var(--u));font-weight:500;display:flex;align-items:flex-end;gap:.3em}
.label .or i{display:inline-block;width:5.5em;border-bottom:.06em solid currentColor;height:.9em}
.label .shop{top:calc(1*var(--u));right:1.5%;font-size:calc(2.6*var(--u));font-weight:500;opacity:.55;letter-spacing:.06em;text-transform:uppercase}
.label.bg-noir{background:#000;color:#fff}
.label.bg-rouge{background:#c8102e;color:#fff}
.label.bg-blanc{background:#fff;color:#000}

/* Brother price label (épicerie), 62 mm wide */
.blabel{position:absolute;inset:0;background:#fff;color:#000;display:flex;flex-direction:column;padding:.45em .6em .4em;line-height:1.05;overflow:hidden;font-family:var(--font-ui)}
.blabel .bn{font-weight:700;text-transform:uppercase;font-size:1em;line-height:1.05;max-height:2.15em;overflow:hidden;text-wrap:balance}
.blabel .bm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.blabel .pb{display:flex;align-items:center;gap:.2em}
.blabel .pb .int{font-family:var(--font-display);font-size:3.6em;line-height:.85}
.blabel .pb .dec{display:flex;flex-direction:column;line-height:1}
.blabel .pb .cents{font-family:var(--font-display);font-size:1.6em;line-height:.9}
.blabel .pb .eu{font-family:var(--font-display);font-size:1em}
.blabel .pb .unit{font-weight:700;font-size:.6em;text-transform:uppercase}
.blabel .oq{font-family:var(--font-display);font-size:1.1em;text-transform:uppercase;text-align:center}
.blabel .ob .pb .int{font-size:2.8em}
.blabel .ob .pb .cents{font-size:1.3em}
.blabel .om{font-weight:700;text-transform:uppercase;font-size:.62em;text-align:center}
.blabel .bf{display:flex;justify-content:space-between;align-items:flex-end;font-size:.6em;gap:.4em}
.blabel .bf .usual{font-weight:700}
.blabel.bg-noir{background:#000;color:#fff}
.blabel.bg-rouge{background:#b0101e;color:#fff}

/* traceability label (62 mm wide) */
.tlabel{position:absolute;inset:0;background:#fff;color:#000;display:flex;flex-direction:column;padding:.55em .6em;line-height:1.12;overflow:hidden;font-family:var(--font-ui)}
.tlabel .th{display:flex;justify-content:space-between;align-items:baseline;gap:.4em;border-bottom:.12em solid #000;padding-bottom:.25em}
.tlabel .th b{font-size:1.05em;text-transform:uppercase;letter-spacing:.02em}
.tlabel .th span{font-size:.62em;color:#333;text-align:right}
.tlabel .tt{font-family:var(--font-display);font-size:1.2em;letter-spacing:.06em;margin-top:.35em;background:#000;color:#fff;padding:.1em .4em;align-self:flex-start}
.tlabel .tn{font-weight:700;font-size:1.35em;text-transform:uppercase;line-height:1.05;margin-top:.4em;text-wrap:balance}
.tlabel .tk{display:grid;grid-template-columns:1fr 1fr;gap:.3em;margin:.4em 0;align-items:end}
.tlabel .tk div{border:.1em solid #000;border-radius:.3em;padding:.25em .4em}
.tlabel .tk small{display:block;font-size:.62em;text-transform:uppercase;letter-spacing:.06em;color:#333}
.tlabel .tk b{font-size:1.25em;line-height:1;word-break:break-all}
.tlabel .tr{font-size:.82em;display:flex;flex-direction:column;gap:.18em}
.tlabel .tr div{display:flex;gap:.4em}
.tlabel .tr span{flex:none;width:7.2em;text-transform:uppercase;font-size:.78em;letter-spacing:.04em;color:#333;padding-top:.15em}
.tlabel .tr b{flex:1;min-width:0}
.tlabel .tdlc{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:.5em;background:#000;color:#fff;padding:.4em .6em;border-radius:.3em}
.tlabel .tdlc small{font-size:.7em;text-transform:uppercase;letter-spacing:.08em}
.tlabel .tdlc b{font-size:1.6em;line-height:1}
.tlabel .tall{font-size:.78em;margin-top:.35em}
.tlabel .tall b{text-transform:uppercase}
.tlabel .tf{font-size:.6em;color:#444;margin-top:.3em;display:flex;justify-content:space-between}
.tlabel.short{padding:.35em .45em}
.tlabel.short .tn{font-size:1.1em;margin-top:.15em;max-height:2.2em;overflow:hidden}
.tlabel.short .tk{margin:.2em 0}
.tlabel.short .tdlc{padding:.25em .45em}

/* generic document pages (orders, register) */
.docpage{padding:12mm 14mm;font-family:var(--font-ui);color:#000;font-size:3.4mm}
.docpage h1{font-size:6mm;margin-bottom:1mm}
.docpage .dh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.5mm solid #000;padding-bottom:2mm;margin-bottom:4mm}
.docpage table{width:100%;border-collapse:collapse;font-size:3.1mm}
.docpage th{text-align:left;font-size:2.6mm;text-transform:uppercase;letter-spacing:.05em;border-bottom:.3mm solid #000;padding:1.2mm 1.5mm}
.docpage td{padding:1.6mm 1.5mm;border-bottom:.15mm solid #999;vertical-align:top}
.docpage .ord{border:.3mm solid #000;border-radius:1.5mm;padding:2.5mm 3mm;margin-bottom:2.5mm;break-inside:avoid}
.docpage .ord .t{display:flex;justify-content:space-between;font-weight:700;font-size:4mm}
.docpage .ord .x{margin-top:1mm;white-space:pre-wrap}

/* ---------- preview modal / overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,18,16,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:700px){.overlay{align-items:center;padding:24px}}
.modal{background:var(--bg);color:var(--fg);width:100%;max-width:980px;max-height:100%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media(min-width:700px){.modal{border-radius:14px;max-height:92vh}}
.modal.narrow{max-width:640px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-body{overflow:auto;padding:16px 18px;flex:1;min-height:0}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.preview-sheets{display:flex;flex-direction:column;gap:18px;align-items:center}
.preview-sheet{box-shadow:0 2px 12px rgba(0,0,0,.25);background:#fff;overflow:hidden;position:relative}
.preview-sheet .sheet{position:absolute;left:0;top:0;transform-origin:0 0}
.preview-cap{font-size:.8rem;color:var(--fg-2);text-align:center}
#print-root{position:fixed;left:0;top:0;z-index:70;pointer-events:none;background:#fff}
#print-root:empty{display:none}
#print-root .sheet{margin:0}
.busy-overlay{position:fixed;inset:0;z-index:80;background:rgba(20,18,16,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:600;font-size:1.1rem}
.busy-overlay .spin{width:36px;height:36px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- toast ---------- */
.toast-wrap{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(94vw,520px)}
.toast{background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:.9rem;display:flex;gap:12px;align-items:center;pointer-events:auto;max-width:100%}
.toast.err{background:var(--crit);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.toast button{border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:6px;padding:4px 9px;font-weight:700}

/* ---------- misc ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--fg-2)}
.kv dd{margin:0;font-weight:600}
.notice{padding:12px 14px;border-radius:var(--radius-s);background:var(--info-soft);color:var(--fg);font-size:.88rem;border-left:4px solid var(--info)}
.notice.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.notice.crit{background:var(--crit-soft);border-left-color:var(--crit)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--fg-2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.day-group{margin-bottom:16px}
.day-group h3{padding:6px 0;color:var(--fg-2);font-size:.8rem;letter-spacing:.07em;text-transform:uppercase}
.order{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px}
.order .time{font-family:var(--font-display);font-size:1.5rem;line-height:1;min-width:56px}
.order .who{font-weight:700}
.order .txt{white-space:pre-wrap;margin-top:4px;color:var(--fg)}
.order.done{opacity:.55}
.order .actions{display:flex;flex-direction:column;gap:6px}
@media(max-width:520px){.order{grid-template-columns:auto 1fr}.order .actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}}
.dlc-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dlc-row .d{font-family:var(--font-display);font-size:1.3rem;min-width:88px;line-height:1}
.dlc-row.crit .d{color:var(--crit)}
.dlc-row.warn .d{color:var(--warn)}
.ing-row{display:grid;grid-template-columns:2fr 1fr 1fr 2fr auto;gap:6px;align-items:center}
@media(max-width:640px){.ing-row{grid-template-columns:1fr 1fr;}.ing-row .input{min-height:36px}}
.stock-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.stock-bar i{display:block;height:100%;background:var(--ok)}
.stock-bar.low i{background:var(--crit)}
.photo-thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.code-tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;background:var(--surface-2);padding:2px 7px;border-radius:5px;font-size:.84rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.reg-section{margin-bottom:22px}
.help{font-size:.82rem;color:var(--fg-2)}
details.adv summary{cursor:pointer;font-weight:600;color:var(--fg-2);padding:6px 0}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-head h2{text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);text-align:center;padding:4px 0}
.cal-day{min-height:62px;border:1px solid var(--line);border-radius:7px;padding:4px 5px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative}
.cal-day:hover{border-color:var(--line-strong)}
.cal-day.other{opacity:.45}
.cal-day.today{box-shadow:0 0 0 3px var(--today) inset;border-color:var(--today)}
.cal-day.sel{background:var(--surface-2)}
.cal-day .dn{font-size:.78rem;font-weight:700;color:var(--fg-2)}
.cal-day.today .dn{color:var(--today)}
.cal-day .cubes{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.cube{width:11px;height:11px;border-radius:2px;display:inline-block}
.cube.g{background:var(--ok)}.cube.o{background:var(--warn)}.cube.r{background:var(--crit)}.cube.d{background:var(--fg-3)}
.cal-day .more{font-size:.68rem;font-weight:700;color:var(--fg-2)}
@media(max-width:560px){.cal-day{min-height:48px;padding:3px}.cube{width:8px;height:8px}}
.standby{position:fixed;inset:0;z-index:95;background:#0c0d12;color:#e9e6df;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:18px;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));cursor:pointer;user-select:none}
.standby .clock{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #2a2c36;padding-bottom:12px}
.standby .clock .t{font-family:var(--font-display);font-size:clamp(3rem,9vw,6rem);line-height:1}
.standby .clock .d{color:#a7a49c;font-size:1.1rem;text-transform:capitalize}
.standby h3{color:#8f8c84;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.standby .col{min-width:0;overflow:hidden}
.standby .it{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #1f2128;font-size:1.05rem}
.standby .it .d{font-family:var(--font-display);min-width:64px;color:#d8d5cd}
.standby .it.r .d{color:#ff5a66}.standby .it.o .d{color:#f0a53a}
.standby .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#6c6a64;font-size:.85rem}
@media(max-width:700px){.standby{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- direct print (local file mode) ---------- */
@page{margin:0}
@page portrait{size:A4 portrait;margin:0}
@page landscape{size:A4 landscape;margin:0}
@media print{
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  body > *:not(#print-root){display:none!important}
  body::before{display:none}
  #print-root{position:static!important;left:auto;display:block!important;visibility:visible!important;pointer-events:auto;z-index:auto}
  #print-root *{visibility:visible!important}
  #print-root .sheet{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print-root .sheet{page-break-after:always;break-after:page;margin:0}
  #print-root .sheet.orient-portrait{page:portrait}
  #print-root .sheet.orient-landscape{page:landscape}
}

/* ===== refonte tactile : gros boutons, tuiles, navigation par l'accueil ===== */
html{font-size:17px}
.nav{display:none!important}
.masthead-inner{height:64px}
.home-btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35);min-height:46px;padding:0 18px 0 12px;font-size:1.05rem;border-radius:12px}
.home-btn svg{width:22px;height:22px}
body.is-home .home-btn,body.gestion-mode .home-btn{display:none}
.btn{min-height:46px;font-size:1rem}
.btn-sm{min-height:38px;font-size:.9rem}
.btn-lg{min-height:54px;font-size:1.08rem}
.btn-xl{min-height:64px;font-size:1.15rem;padding:0 22px;border-radius:14px;flex:1 1 220px}
.btn-xl svg{width:22px;height:22px}
.input,.select,select{min-height:48px;font-size:1.02rem}
.chip{min-height:42px;font-size:.98rem;padding:0 16px}
.home-top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between;padding:6px 0 14px}
.home-top h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,4vw,2.8rem);letter-spacing:.01em;text-transform:uppercase;margin:0}
.home-summary{display:flex;flex-wrap:wrap;gap:8px}
.sum{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600;font-size:.95rem;min-height:44px}
.sum b{font-size:1.25rem}
.sum.alert{background:#fff3cd;border-color:#f3c200}
.quick{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:14px}
.tiles.small{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:20px 20px 18px;background:var(--surface);border:2px solid var(--line);border-radius:18px;text-decoration:none;color:inherit;min-height:160px;box-shadow:0 2px 0 rgba(0,0,0,.04);transition:transform .08s,border-color .12s}
.tile:active{transform:scale(.98)}
.tile.sm{min-height:112px;padding:16px}
.tile .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.tile .ico svg{width:28px;height:28px}
.tile.sm .ico{width:40px;height:40px;border-radius:10px}.tile.sm .ico svg{width:22px;height:22px}
.tile .t{font-size:1.35rem;font-weight:800;line-height:1.1}
.tile.sm .t{font-size:1.05rem}
.tile .n{font-size:2.3rem;font-weight:800;line-height:1;position:absolute;right:20px;top:18px;color:var(--fg-2)}
.tile.sm .n{font-size:1.5rem;right:16px;top:14px}
.tile .k{font-size:.92rem;color:var(--fg-2);margin-top:auto}
.tile.alert{border-color:#f3c200;background:#fffbe6}
.tile.alert .n{color:#b42318}
.prod-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pcard{min-height:120px}
.format-btn,.bg-opt{min-height:60px}
.check input[type=checkbox],.check input[type=radio]{width:24px;height:24px}
@media(min-width:1000px){.tiles{grid-template-columns:repeat(3,1fr)}.tiles.small{grid-template-columns:repeat(4,1fr)}.tile{min-height:180px}}
@media(max-width:600px){html{font-size:16px}.tiles{grid-template-columns:repeat(2,1fr)}.tile{min-height:140px;padding:16px}.tile .t{font-size:1.1rem}.tile .n{font-size:1.8rem}.btn-xl{min-height:56px;font-size:1.02rem}}

.page-head{margin-bottom:14px}
.page-head h1{font-size:1.9rem}
.page-head .lead{font-size:.95rem}
.toolbar{gap:10px}
.tabs{gap:10px;border-bottom:0;margin-bottom:16px;padding:2px 0}
.tabs button{flex:1 1 160px;min-height:62px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-size:1.08rem;font-weight:700;color:var(--fg-2);margin:0;padding:10px 14px}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{padding:4px;gap:4px;border-radius:12px}
.seg button{min-height:44px;padding:8px 16px;font-size:.98rem;border-radius:9px}
.list-item{padding:14px 16px;min-height:64px;gap:14px}
.list-item .title{font-size:1.05rem}
.table th{font-size:.78rem;padding:10px 12px}
.table td{padding:13px 12px;font-size:1rem}
.order{padding:16px;min-height:76px;font-size:1.02rem}
.cal-day{min-height:84px;padding:6px 7px}.cal-day .dn{font-size:1.05rem;font-weight:700}.cube{width:11px;height:11px}
.card-head h2{font-size:1.15rem}
.queue-item{min-height:56px}
.icon-btn{width:46px;height:46px}.icon-btn svg{width:20px;height:20px}
.pcard .nm{font-size:1.1rem}.pcard .sp{font-size:1.3rem}
.modal .btn{min-height:50px}
.modal-foot{gap:10px}
.fld label,.field label{font-size:.9rem}
textarea.input{min-height:90px}
.pill{font-size:.8rem;padding:4px 10px}

.temp-list{display:flex;flex-direction:column;gap:8px}
.temp-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);flex-wrap:wrap}
.temp-row.ok{border-color:#9bd4a8;background:#f2fbf4}.temp-row.out{border-color:#e0616f;background:#fff1f2}
.temp-name{display:flex;flex-direction:column;gap:2px;font-size:1.1rem}.temp-name .muted{font-size:.85rem}
.temp-ctl{display:flex;align-items:center;gap:8px}
.temp-btn{width:60px;height:60px;font-size:1.8rem;border-radius:14px;padding:0}

function productLabelOrigin(p) {
  const d = p.detail || {};
  if ((p.espece === 'bovin' || p.espece === 'veau') && (d.ne || d.eleve || d.abattu)) {
    const same = d.ne && d.ne === d.eleve && d.eleve === d.abattu;
    const parts = same ? [`Origine : ${d.ne}`] : [`Né : ${d.ne || '?'}`, `Élevé : ${d.eleve || '?'}`, `Abattu : ${d.abattu || '?'}`];
    const extra = []; if (d.categorie) extra.push(d.categorie); if (d.race) extra.push(d.race);
    return { lines: [parts.join(' · ')].concat(extra.length ? [extra.join(' · ')] : []) };
  }
  if (['volaille', 'porc', 'ovin', 'caprin', 'lapin'].includes(p.espece) && (d.eleve || d.abattu)) {
    const same = d.eleve && d.eleve === d.abattu;
    return { lines: [same ? `Origine : ${d.eleve}` : `Élevé : ${d.eleve || '?'} · Abattu : ${d.abattu || '?'}`] };
  }
  if (p.origin) return { lines: [`Origine : ${p.origin}`] };
  return { lines: [] };
}

/* ===================== évolution des prix ===================== */
const EvoOpts = { id: '', q: '', period: '6m' };
function evoSeries(p, period) {
  const h = (p.historique || []).filter(x => x.t && x.a != null).sort((a, b) => a.t.localeCompare(b.t));
  const now = new Date(); const days = { '1m': 31, '3m': 92, '6m': 183, '1a': 366, 'tout': 36500 }[period] || 183;
  const from = new Date(now.getTime() - days * 86400000);
  const pts = [];
  const before = h.filter(x => new Date(x.t) < from); const start = before.length ? before[before.length - 1].a : (h.length ? h[0].de : p.price);
  if (start != null) pts.push({ t: from, v: Number(start), virtual: true });
  h.filter(x => new Date(x.t) >= from).forEach(x => pts.push({ t: new Date(x.t), v: Number(x.a), de: x.de }));
  if (p.price != null) pts.push({ t: now, v: Number(p.price), virtual: true });
  return { pts, changes: h.filter(x => new Date(x.t) >= from).reverse(), from, to: now };
}
function evoChartSvg(p, period, W = 720, H = 300) {
  const { pts, from, to } = evoSeries(p, period);
  if (pts.length < 2) return `<div class="empty"><span>Pas encore d'historique pour ce produit sur cette période.</span></div>`;
  const padL = 56, padR = 16, padT = 18, padB = 36; const w = W - padL - padR, h = H - padT - padB;
  const vals = pts.map(x => x.v); let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) { lo = lo * 0.9; hi = hi * 1.1 || 1; } const m = (hi - lo) * 0.12; lo -= m; hi += m;
  const X = t => padL + (t - from) / (to - from) * w, Y = v => padT + (hi - v) / (hi - lo) * h;
  let d = ''; pts.forEach((pt, i) => { const x = X(pt.t), y = Y(pt.v); if (i === 0) d += `M${x.toFixed(1)} ${y.toFixed(1)}`; else { const py = Y(pts[i - 1].v); d += ` L${x.toFixed(1)} ${py.toFixed(1)} L${x.toFixed(1)} ${y.toFixed(1)}`; } });
  const ticks = 4; let grid = ''; for (let i = 0; i <= ticks; i++) { const v = lo + (hi - lo) * i / ticks; const y = Y(v); grid += `<line x1="${padL}" x2="${W - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e5e2dc"/><text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="#6b6762">${v.toFixed(2).replace('.', ',')} €</text>`; }
  const span = to - from; const nx = 5; let xl = ''; for (let i = 0; i <= nx; i++) { const t = new Date(from.getTime() + span * i / nx); const x = X(t); xl += `<text x="${x.toFixed(1)}" y="${H - 12}" text-anchor="${i === 0 ? 'start' : i === nx ? 'end' : 'middle'}" font-size="12" fill="#6b6762">${t.toLocaleDateString('fr-FR', span > 200 * 86400000 ? { month: 'short', year: '2-digit' } : { day: '2-digit', month: 'short' })}</text>`; }
  const dots = pts.filter(x => !x.virtual).map(x => `<circle cx="${X(x.t).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="4.5" fill="#163bdc" stroke="#fff" stroke-width="2"><title>${x.t.toLocaleDateString('fr-FR')} : ${fmtMoney(x.de)} → ${fmtMoney(x.v)}</title></circle>`).join('');
  return `<svg class="evo-chart" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Évolution du prix">${grid}<path d="${d}" fill="none" stroke="#163bdc" stroke-width="3" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}

async function backupAll() { const o = Store.exportAll(); await deliverText(JSON.stringify(o, null, 1), `sauvegarde-boucherie-${todayStr()}.json`); }
async function wipeAll() {
  if (!(await confirmDialog('Effacer définitivement toutes les données du site (produits, réceptions, lots, commandes, factures, stocks, recettes) ? Faites une sauvegarde avant.', { danger: true, ok: 'Tout effacer', title: 'Tout effacer' }))) return;

        <div class="col"><h3>Dates à venir (7 jours)</h3>${dl.length ? dl.map(x => `<div class="it ${dlcClass(x)}"><span class="d">${esc(fmtDate(x.dlc).slice(0, 5))}</span><span>${esc(x.produit)}${x.lot ? ' · ' + esc(x.lot) : ''} <span style="color:#8f8c84">· ${esc(x.type || 'DLC')}</span></span></div>`).join('') : '<div class="it"><span style="color:#8f8c84">Aucune date dans les 7 jours.</span></div>'}</div>
        <div class="col"><h3>Commandes du jour</h3>${cm.length ? cm.map(c => `<div class="it"><span class="d">${esc(c.heure || '—')}</span><span>${esc(c.client)} <span style="color:#8f8c84">· ${esc(STATUT_CMD[c.statut]?.[0] || '')}</span></span></div>`).join('') : '<div class="it"><span style="color:#8f8c84">Aucune commande aujourd\'hui.</span></div>'}</div>

    };

  },

};
['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(ev => document.addEventListener(ev, () => { if (!Standby.el) Standby.arm(); }, { passive: true }));

/* ===================== TEMPÉRATURES DES ÉQUIPEMENTS ===================== */
const EQUIP_INIT = [['Comptoir tour 1', -2, 4], ['Comptoir tour 2', -2, 4], ['Comptoir zone 1', -2, 4], ['Comptoir zone 2', -2, 4], ['Chambre froide', 0, 4], ['Congélateur', -30, -18]];

function momentAuto() { return Number(nowTime().slice(0, 2)) < 14 ? 'matin' : 'soir'; }

  const hist = () => { const days = {}; Store.all('temperatures').forEach(r => { (days[r.date] = days[r.date] || {})[r.moment] = r; }); const list = Object.keys(days).sort().reverse().slice(0, 60);

async function saveTemps() {
  const eqs = equipList(); const t = todayStr(); const date = TempOpts.date || t; const moment = TempOpts.moment || momentAuto();
  const prev = Store.get('temperatures', releveId(date, moment)); const vals = Object.assign({}, prev ? prev.vals : {}, TempOpts.vals);
  const missing = eqs.filter(e => vals[e.id] == null || vals[e.id] === '');
  if (missing.length && !(await confirmDialog(`${missing.length} équipement${missing.length > 1 ? 's' : ''} sans température (${missing.map(e => e.nom).join(', ')}). Valider quand même ?`, { ok: 'Valider' }))) return;
  const out = eqs.filter(e => { const v = vals[e.id]; return v != null && v !== '' && ((e.min != null && v < e.min) || (e.max != null && v > e.max)); });
  const par = (($('#temp-par') || {}).value || '').trim(); LS.set('tempPar', par);
  await Store.set('temperatures', releveId(date, moment), { date, moment, heure: nowTime(), vals, par, t: new Date().toISOString(), horsPlage: out.map(e => e.nom) });
  TempOpts.vals = {};
  if (out.length) toast(`Relevé enregistré · ATTENTION : ${out.map(e => e.nom).join(', ')} hors plage`, 'err', 8000); else toast('Relevé enregistré', 'ok');
  render();
}

    ${list.length ? `<div class="photo-grid big">${list.slice(0, 120).map(p => `<div class="photo-cell"><img src="${esc(p.photo)}" alt="" data-act="tphotoview" data-id="${p.id}"><div class="photo-cap">${esc(fmtDateTime(p.t))}${p.note ? ' · ' + esc(p.note) : ''}</div><button class="icon-btn" data-act="tphotodel" data-id="${p.id}">${I.trash}</button></div>`).join('')}</div>${list.length > 120 ? `<p class="help">${list.length - 120} autres photos : réduisez la période.</p>` : ''}` : '<div class="empty"><span>Aucune photo sur cette période.</span></div>'}

async function tracePhotoAdd(files) {
  for (const f of Array.from(files || [])) { try { const small = await resizeImage(f, 1100, 0.7); _tracePending.push({ blob: small, url: URL.createObjectURL(small) }); } catch (e) { toast('Photo illisible', 'err'); } }

async function tracePhotoSave() {

    for (const p of _tracePending) { const data = await new Promise(res => { const rd = new FileReader(); rd.onload = () => res(rd.result); rd.readAsDataURL(p.blob); }); await Store.set('tracephotos', 'tp-' + uid(), { t: new Date().toISOString(), date: todayStr(), note, photo: data }); }

}

  if (!pages.length) return;
  try { if (canDirectPrint()) await directPrint(pages, null, `tracabilite-photos-${todayStr()}.pdf`); else { const blob = await pagesToPdf(pages, { scale: 2 }); await deliverPdf(blob, `tracabilite-photos-${todayStr()}.pdf`); } } catch (e) { toast('Échec : ' + e.message, 'err', 6000); }
