<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MIN Lomme">
<meta name="theme-color" content="#2f7a3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/marche-180.png">
<link rel="apple-touch-icon" href="../icons/marche-180.png">
<title>Liste MIN DE LOMME</title>
<style>
/* Layout : une colonne, gros boutons tactiles, barre d'envoi collée en bas */
:root{
  --bg:#f6f4ee; --fg:#1f2a1f; --muted:#6b7a66; --line:#d9d6c9;
  --accent:#2f7a3d; --accent-fg:#ffffff; --card:#ffffff; --check:#e8f3ea;
  --font:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#171b17; --fg:#eef1ea; --muted:#9aa693; --line:#2f362e;
  --accent:#5fbf6f; --accent-fg:#0f1a10; --card:#20261f; --check:#243a28; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#171b17; --fg:#eef1ea; --muted:#9aa693; --line:#2f362e;
  --accent:#5fbf6f; --accent-fg:#0f1a10; --card:#20261f; --check:#243a28; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) 130px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
h1{font-size:22px;margin:0;text-wrap:balance}
.count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;min-height:52px}
.item.on{background:var(--check);border-color:var(--accent)}
.item label{flex:1;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-width:0}
.item input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none;margin:0}
.item .name{flex:1;min-width:0;word-wrap:break-word}
.item .qty{width:70px;font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);text-align:center}
.item .del{border:0;background:none;color:var(--muted);font-size:22px;padding:10px 14px;cursor:pointer;line-height:1}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.add button,.bar button,.bar a{font:inherit;font-weight:600;border-radius:10px;padding:12px 16px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar .primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);grid-column:1/-1;font-size:18px;padding:14px}
.bar .small{font-size:15px}
.toast{text-align:center;color:var(--muted);font-size:14px;margin-top:8px;min-height:18px}
pre.msg{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:15px;margin:10px 0 0}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Liste MIN de Lomme</h1>
    <div class="count" id="count">0 article</div>
  </header>
  <p style="margin:0 0 6px;color:var(--muted);font-size:15px">Coche ce qui manque, mets une quantité si besoin, puis envoie.</p>

  <h2>Fruits</h2>
  <div class="list" id="list-fruits"></div>
  <h2>Légumes</h2>
  <div class="list" id="list-legumes"></div>
  <h2>Herbes & autres</h2>
  <div class="list" id="list-autres"></div>

  <h2>Ajouter un produit</h2>
  <div class="add">
    <input id="add-name" placeholder="Ex. Mangue" aria-label="Nom du produit">
    <select id="add-cat" style="font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:0 8px">
      <option value="fruits">Fruits</option><option value="legumes">Légumes</option><option value="autres">Autres</option>
    </select>
    <button id="add-btn" type="button">+</button>
  </div>

  <h2>Aperçu du message</h2>
  <pre class="msg" id="preview">Rien de coché pour l'instant.</pre>
  <div class="toast" id="toast"></div>
</div>

<div class="bar">
  <div class="inner">
    <a class="primary" id="wa" href="#" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>
    <button class="small" id="copy" type="button">Copier le message</button>
    <button class="small" id="reset" type="button">Tout décocher</button>
  </div>
</div>

<script>
const DEFAULTS = {
  fruits: ["Pommes","Poires","Bananes","Oranges","Clémentines","Citrons","Raisin","Kiwis","Fraises","Pêches","Nectarines","Abricots","Prunes","Melon","Pastèque","Ananas","Mangues","Avocats","Grenades","Dattes"],
  legumes: ["Tomates","Pommes de terre","Oignons","Oignons rouges","Ail","Carottes","Courgettes","Aubergines","Poivrons","Concombres","Salade","Choux","Chou-fleur","Brocolis","Poireaux","Navets","Betteraves","Haricots verts","Champignons","Épinards","Fenouil","Céleri","Courge","Patates douces","Radis"],
  autres: ["Persil","Coriandre","Menthe","Basilic","Piments","Gingembre","Olives","Citrons confits"]
};
const KEY="marche-el-fen-v1";
let state;
try{ state = JSON.parse(localStorage.getItem(KEY)) }catch(e){}
if(!state || !state.items){
  state = {items:{}, checked:{}, qty:{}};
  for(const c in DEFAULTS) state.items[c]=DEFAULTS[c].slice();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)) }catch(e){} }

function render(){
  let n=0;
  for(const cat of ["fruits","legumes","autres"]){
    const box=document.getElementById("list-"+cat); box.innerHTML="";
    for(const name of state.items[cat]){
      const id=cat+"|"+name, on=!!state.checked[id]; if(on) n++;
      const div=document.createElement("div"); div.className="item"+(on?" on":"");
      div.innerHTML=`<label><input type="checkbox" id="c-${cssId(id)}" ${on?"checked":""}><span class="name">${esc(name)}</span></label>
        <input class="qty" id="q-${cssId(id)}" placeholder="qté" value="${esc(state.qty[id]||"")}" ${on?"":"hidden"}>
        <button class="del" type="button" aria-label="Supprimer ${esc(name)}">×</button>`;
      div.querySelector("input[type=checkbox]").onchange=e=>{ state.checked[id]=e.target.checked; save(); render(); };
      div.querySelector(".qty").oninput=e=>{ state.qty[id]=e.target.value; save(); preview(); };
      div.querySelector(".del").onclick=()=>{ state.items[cat]=state.items[cat].filter(x=>x!==name); delete state.checked[id]; save(); render(); };
      box.appendChild(div);
    }
  }
  document.getElementById("count").textContent = n+" article"+(n>1?"s":"")+" coché"+(n>1?"s":"");
  preview();
}
function message(){
  const lines=[];
  for(const cat of ["fruits","legumes","autres"]) for(const name of state.items[cat]){
    const id=cat+"|"+name; if(state.checked[id]) lines.push("- "+name+(state.qty[id]?" ("+state.qty[id]+")":""));
  }
  if(!lines.length) return "";
  const d=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  return "MIN de Lomme "+d+" — à prendre :\n"+lines.join("\n");
}
function preview(){
  const m=message();
  document.getElementById("preview").textContent = m || "Rien de coché pour l'instant.";
  document.getElementById("wa").href = m ? "https://wa.me/?text="+encodeURIComponent(m) : "#";
}
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; setTimeout(()=>el.textContent="",2500); }
document.getElementById("copy").onclick=()=>{
  const m=message(); if(!m) return toast("Coche d'abord des produits.");
  navigator.clipboard.writeText(m).then(()=>toast("Message copié. Colle-le dans ton SMS ou WhatsApp.")).catch(()=>{
    const r=document.createRange(); r.selectNodeContents(document.getElementById("preview")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Sélectionné : fais Copier.");
  });
};
document.getElementById("wa").onclick=e=>{ if(!message()){ e.preventDefault(); toast("Coche d'abord des produits."); } };
document.getElementById("reset").onclick=()=>{ state.checked={}; state.qty={}; save(); render(); };
document.getElementById("add-btn").onclick=()=>{
  const inp=document.getElementById("add-name"), name=inp.value.trim(); if(!name) return;
  const cat=document.getElementById("add-cat").value;
  if(!state.items[cat].includes(name)) state.items[cat].push(name);
  inp.value=""; save(); render();
};
document.getElementById("add-name").onkeydown=e=>{ if(e.key==="Enter") document.getElementById("add-btn").click(); };
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function cssId(s){ return s.replace(/[^a-z0-9]/gi,"_"); }
render();
</script>

</body>
</html>
